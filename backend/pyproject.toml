[project]
name = "lifeos-backend"
version = "0.1.0"
description = "LifeOS - AI wearable memory assistant backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    "redis>=5.1.0",
    "celery>=5.4.0",
    # AI via CometAPI (direct HTTP, no SDK needed)
    # "anthropic>=0.40.0",  # optional: if using official SDK
    # "openai>=1.50.0",     # optional: if using official SDK
    "boto3>=1.35.0",
    "python-multipart>=0.0.12",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "chromadb>=0.5.0",
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "S", "B"]
ignore = ["S101"]
